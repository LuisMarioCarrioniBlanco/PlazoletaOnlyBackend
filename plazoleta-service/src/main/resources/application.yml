server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: plazoleta-service
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/plazoleta;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-this-value-1234567890}

plazoleta:
  internal-token: ${INTERNAL_API_TOKEN:local-internal-token-change-before-deploy}

servicios:
  usuarios:
    url: ${USUARIOS_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
